services:
  - type: web
    name: alresume-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    branch: main
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: alresume-backend
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: alresume-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: alresume-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: alresume-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: alresume-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: alresume-db
          property: password
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: LOG_CHANNEL
        value: stderr
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: gemini

databases:
  - name: alresume-db
    databaseName: alresume
    user: alresume
    region: singapore
    plan: free
